<!doctype html>
<html lang="id">
  <body style="margin:0;background:#fff7ed;font-family:Arial,sans-serif;color:#1f2937">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:28px 12px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #fed7aa;border-radius:24px;padding:32px">
          <tr><td align="center">
            <div style="font-size:28px;font-weight:800;color:#f97316">Dimsum Lumer</div>
            <h1 style="margin:24px 0 8px;font-size:22px">Reset kata sandi</h1>
            <p style="margin:0;color:#6b7280;font-size:14px;line-height:22px">Gunakan kode berikut pada halaman Lupa Kata Sandi:</p>
            <div style="margin:22px 0;padding:18px;border-radius:16px;background:#fff7ed;color:#ea580c;font-size:32px;font-weight:800;letter-spacing:8px">{{ .Token }}</div>
            <p style="margin:0 0 18px;color:#9ca3af;font-size:12px">Atau gunakan tombol aman berikut:</p>
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 24px;border-radius:14px;background:#f97316;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700">Buat Kata Sandi Baru</a>
            <p style="margin:24px 0 0;color:#9ca3af;font-size:11px;line-height:18px">Kode dan tautan hanya berlaku sementara. Abaikan email ini jika kamu tidak meminta reset kata sandi.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
